name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-fast:
    name: Node ${{ matrix.node }} fast tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run fast test suite (no LEAN)
        run: npm test -- --fast

  python-engine:
    name: Python 3.11 engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numpy, pandas, scipy and matplotlib (no qlib)
        run: python -m pip install numpy==1.26.4 pandas==2.3.3 scipy==1.13.1 matplotlib
      - name: Run engine tests that do not import qlib
        # test_qs_qlib.py is excluded: it imports qs_qlib, which imports qlib at module level.
        # test_qs_light runs the idea-check / export path with qlib blocked.
        run: |
          for t in test_qs_core test_qs_data test_qs_fund test_qs_idea test_qs_expr test_qs_light; do
            python engine/qlib_research/$t.py
          done
          python engine/test_helm_vol.py
